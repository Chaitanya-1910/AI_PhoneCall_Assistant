apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaya-api
  labels:
    app: chaya
    component: api
spec:
  replicas: 3 # Horizontal scaling of stateless API
  selector:
    matchLabels:
      app: chaya
      component: api
  template:
    metadata:
      labels:
        app: chaya
        component: api
    spec:
      containers:
      - name: api
        image: chaya/api:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chaya-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: chaya-secrets
              key: redis-url
        - name: ENVIRONMENT
          value: production
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chaya-api-service
spec:
  selector:
    app: chaya
    component: api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: LoadBalancer
