version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://chaya:password@postgres:5432/chayadb
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis

  worker:
    build: 
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.worker"] # Background tasks processor (e.g. Event Store persistence)
    environment:
      - DATABASE_URL=postgresql+asyncpg://chaya:password@postgres:5432/chayadb
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=chaya
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chayadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
