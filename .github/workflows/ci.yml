name: CHAYA CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install
        
    - name: Run linting (Flake8)
      run: |
        poetry run flake8 app/
        
    - name: Run security scan (Bandit)
      run: |
        poetry run bandit -r app/
        
    - name: Run unit and integration tests (PyTest)
      run: |
        poetry run pytest tests/ --cov=app --cov-report=xml
        
  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    - name: Build and Push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: false # Set true and add registry credentials for real deployments
        tags: chaya/api:latest
