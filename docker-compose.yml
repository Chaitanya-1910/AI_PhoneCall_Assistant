services:
  postgres:
    image: postgres:16-alpine
    container_name: chaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chaya
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: chaya
    ports:
      - "5432:5432"
    volumes:
      - chaya_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaya -d chaya"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  chaya_pg_data:
